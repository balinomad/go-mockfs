name: Feature Request
description: Suggest an idea or enhancement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: decisions-check
    attributes:
      label: Prior Art
      description: Please check before filing.
      options:
        - label: I checked DECISIONS.md and this is not a previously rejected design.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered.
